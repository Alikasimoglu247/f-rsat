services:
  postgres:
    # Same Docker Official Image as CI; pin protects against mutable tag updates.
    image: public.ecr.aws/docker/library/postgres:17.9@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-firsatradar}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - radar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  radar_postgres:

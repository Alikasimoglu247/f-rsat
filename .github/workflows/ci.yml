name: FirsatRadar CI
on:
  pull_request:
  push:
    branches: [main, feature/m2-email-discovery]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: firsatradar
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U radar -d firsatradar"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://radar:ci_local_only@127.0.0.1:5432/firsatradar?schema=public
      TEST_DATABASE_URL: postgresql://radar:ci_local_only@127.0.0.1:5432/firsatradar_test?schema=public
      APP_BASE_URL: http://127.0.0.1:3001
      GMAIL_CLIENT_ID: ""
      GMAIL_CLIENT_SECRET: ""
      TELEGRAM_BOT_TOKEN: ""
      SMTP_HOST: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:test
      - run: npm run test
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build server image
        run: docker build -t firsatradar:ci .
      - name: Verify encrypted token persistence across container restarts
        run: npm run test:runtime -- firsatradar:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
